name: CI

# Se ejecuta en cada push y en cada Pull Request contra main, para pillar errores antes
# de que lleguen a producción (Vercel despliega automáticamente desde main).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Informativo (tarea 7): enseña en el log las vulnerabilidades conocidas de las dependencias,
      # pero no rompe el build (continue-on-error). Se revisan a mano: ver H23 en docs/mejoras-tecnicas.md.
      - name: npm audit (informativo)
        run: npm audit --audit-level=low
        continue-on-error: true
      - run: npm run lint
      # Los tests con cobertura (@vitest/coverage-v8) y sus umbrales, definidos en vite.config.js:
      # si una cifra baja de su umbral, falla. Los umbrales suben tras cada tanda de tests y no se
      # bajan nunca (historial en la tarea 7 de docs/mejoras-tecnicas.md).
      - run: npm run test:coverage
      - run: npm run build

  server:
    name: Server (lint, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # El servidor falla al arrancar sin SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY (ver
    # src/data/supabase.js): son claves de prueba, no reales -- ningún test toca la base de
    # datos de verdad, todos sustituyen supabase.from por un doble en memoria o un fetch falso.
    env:
      SUPABASE_URL: https://ci-test.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: clave-de-prueba-solo-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Informativo (tarea 7): ver el mismo paso en el job del cliente.
      - name: npm audit (informativo)
        run: npm audit --audit-level=low
        continue-on-error: true
      - run: npm run lint
      - run: npm run format:check
      # Los tests con cobertura (la de Node, sin paquetes extra) y sus umbrales en líneas, ramas y
      # funciones, en el script test:coverage de package.json: si una cifra baja de su umbral, falla.
      # Los umbrales suben tras cada tanda de tests y no se bajan nunca (historial en la tarea 7 de
      # docs/mejoras-tecnicas.md).
      - run: npm run test:coverage

  e2e:
    name: E2E (Playwright, no bloqueante)
    runs-on: ubuntu-latest
    # De momento no bloquea: si falla, el job sale en rojo pero el CI sigue en verde. Cuando lleven
    # un tiempo estables, se quita esta línea (ver docs/testing-e2e.md).
    continue-on-error: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # El Chromium de la misma versión que @playwright/test (fijada en package.json), con sus
      # dependencias del sistema.
      - run: npx playwright install --with-deps chromium
      # Arranca la web con Vite (webServer en playwright.config.js) y simula la API en el navegador:
      # no hace falta servidor ni base de datos.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-playwright
          path: client/playwright-report/
          retention-days: 7
