name: CI

# Se ejecuta en cada push y en cada Pull Request contra main, para pillar errores antes
# de que lleguen a producción (Vercel despliega automáticamente desde main).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Informativo (tarea 7): enseña en el log las vulnerabilidades conocidas de las dependencias,
      # pero no rompe el build (continue-on-error). Se revisan a mano: ver H23 en docs/mejoras-tecnicas.md.
      - name: npm audit (informativo)
        run: npm audit --audit-level=low
        continue-on-error: true
      - run: npm run lint
      # Los tests con cobertura (@vitest/coverage-v8) y sus umbrales, definidos en vite.config.js:
      # 60% en ramas y funciones, 50% en líneas. Si una cifra baja de ahí, falla. El 28 sep estaba
      # en 57,9 / 89,3 / 72,1% (líneas / ramas / funciones). Se sube en próximas iteraciones.
      - run: npm run test:coverage
      - run: npm run build

  server:
    name: Server (lint, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # El servidor falla al arrancar sin SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY (ver
    # src/data/supabase.js): son claves de prueba, no reales -- ningún test toca la base de
    # datos de verdad, todos sustituyen supabase.from por un doble en memoria o un fetch falso.
    env:
      SUPABASE_URL: https://ci-test.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: clave-de-prueba-solo-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Informativo (tarea 7): ver el mismo paso en el job del cliente.
      - name: npm audit (informativo)
        run: npm audit --audit-level=low
        continue-on-error: true
      - run: npm run lint
      - run: npm run format:check
      # Los tests con cobertura (la de Node, sin paquetes extra) y un umbral mínimo del 50% en
      # líneas, ramas y funciones: si baja de ahí, falla. El 28 sep estaba en 85,7 / 81,3 / 94,1%.
      # Se empieza bajo para no bloquear, y se sube en próximas iteraciones.
      - run: npm run test:coverage
