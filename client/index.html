    <!-- Precarga de la foto del hero (el LCP de la portada), solo en la portada: con <link rel="preload">
         fijos, quien entraba por el catálogo o una ficha (enlaces de Google o Wallapop) descargaba también
         esta foto (100-370 KB) con prioridad alta, compitiendo con la suya. Los tamaños y los cortes son los
         del hero en Home.jsx. Si se cambia este script, hay que poner su nuevo hash en la CSP (vercel.json). -->
    <script>if(location.pathname==='/'){[['/img/hero-almacen-800.webp','(max-width: 767.98px)'],['/img/hero-almacen-1200.webp','(min-width: 768px) and (max-width: 1200px)'],['/img/hero-almacen.webp','(min-width: 1200.02px)']].forEach(function(f){var l=document.createElement('link');l.rel='preload';l.as='image';l.type='image/webp';l.href=f[0];l.media=f[1];l.setAttribute('fetchpriority','high');document.head.appendChild(l)})}</script>
